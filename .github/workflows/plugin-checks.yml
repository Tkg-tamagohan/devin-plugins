name: plugin-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: スロップリンターの回帰テスト
        working-directory: skills/japanese-tech-writing/scripts
        run: python3 test_slop_lint.py

      - name: プラグイン構造チェック
        run: python3 skills/plugin-authoring/scripts/check_plugin.py

      - name: 文書リント（全 Markdown、warn で失敗）
        run: |
          status=0
          while IFS= read -r -d '' f; do
            src=$(git -c core.excludesFile=.sloplintignore check-ignore --no-index -v -- "$f")
            case $src in .sloplintignore:*) continue ;; esac
            python3 skills/japanese-tech-writing/scripts/slop_lint.py --strict "$f" || status=1
          done < <(git ls-files -z -- '*.md')
          exit $status

      - name: plugin.json バージョン更新チェック
        if: github.event_name == 'pull_request'
        run: python3 skills/plugin-authoring/scripts/check_plugin.py --version-base origin/${{ github.base_ref }}
