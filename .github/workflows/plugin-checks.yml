name: plugin-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: スロップリンターの回帰テスト
        working-directory: skills/japanese-tech-writing/scripts
        run: |
          python3 test_slop_lint.py
          python3 test_catalog_consistency.py

      - name: 生成スクリプトの回帰テスト
        working-directory: skills/plugin-authoring/scripts
        run: python3 test_new_entry.py

      - name: プラグイン構造チェック
        run: python3 skills/plugin-authoring/scripts/check_plugin.py

      - name: 文書リント（全 Markdown、warn で失敗）
        run: |
          status=0
          excluded=$(mktemp); trap 'rm -f "$excluded"' EXIT
          git ls-files -z -c -i -X .sloplintignore -- '*.md' > "$excluded"
          while IFS= read -r -d '' f; do
            grep -qzxF -- "$f" "$excluded" && continue
            python3 skills/japanese-tech-writing/scripts/slop_lint.py --strict "$f" || status=1
          done < <(git ls-files -z -- '*.md')
          exit $status

      - name: plugin.json バージョン更新チェック
        if: github.event_name == 'pull_request'
        run: python3 skills/plugin-authoring/scripts/check_plugin.py --version-base origin/${{ github.base_ref }}
